<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none';">
    <title>Pascal → Блок-схема</title>
    <link rel="stylesheet" href="lib/codemirror/codemirror.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="panel" id="editor-panel">
            <div class="panel-header">
                <span id="file-title">Новый файл</span>
            </div>
            <textarea id="code-editor"></textarea>
        </div>
        <div id="divider"></div>
        <div class="panel" id="flowchart-panel">
            <div class="panel-header">
                <div class="panel-controls">
                    <button id="zoomOutBtn" title="Отдалить">−</button>
                    <span id="zoomLabel">100%</span>
                    <button id="zoomInBtn" title="Приблизить">+</button>
                    <button id="downloadBtn" title="Скачать PNG" style="width:auto;padding:0 8px;">Скачать PNG</button>
                </div>
            </div>
            <div id="flowchart-container">
                <canvas id="flowchart-canvas"></canvas>
            </div>
        </div>
    </main>
    <script src="lib/codemirror/codemirror.min.js"></script>
    <script src="lib/codemirror/pascal.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
